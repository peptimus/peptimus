name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"

      - name: Validate tsconfig.json
        run: node -e "JSON.parse(require('fs').readFileSync('tsconfig.json','utf8')); console.log('tsconfig.json valid')"

      - name: Check source structure
        run: |
          [ -d "src" ] && echo "src/ present" || (echo "src/ missing" && exit 1)
          [ -f "src/main.tsx" ] && echo "src/main.tsx present" || (echo "src/main.tsx missing" && exit 1)
          [ -f "src/App.tsx" ] && echo "src/App.tsx present" || (echo "src/App.tsx missing" && exit 1)
          [ -f "index.html" ] && echo "index.html present" || (echo "index.html missing" && exit 1)

      - name: Check for forbidden platform references
        run: |
          if grep -rI "@replit\|REPL_ID\|REPLIT_DOMAINS\|REPLIT_DEV_DOMAIN" \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --exclude-dir=".github" . 2>/dev/null; then
            echo "Forbidden platform references found" && exit 1
          fi
          echo "Clean"
